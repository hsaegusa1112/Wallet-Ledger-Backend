services:
  app:
    build:
      context: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-wallet_ledger}
      DB_USERNAME: ${POSTGRES_USER:-wallet_ledger}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-wallet_ledger}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wallet_ledger}
      POSTGRES_USER: ${POSTGRES_USER:-wallet_ledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wallet_ledger}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
